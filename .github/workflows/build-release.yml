name: Build and Release Firmware

on:
  push:
    branches:
      - main
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        run: ./build.sh
        env:
          DOCKER_BUILDKIT: '1'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linnstrument-firmware
          path: |
            build/linnstrument-firmware.bin
            build/linnstrument-firmware.elf
            build/linnstrument-firmware.map

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          for ext in bin elf map; do
            cp "linnstrument-firmware.$ext" "linnstrument-firmware-$GITHUB_REF_NAME.$ext"
          done
          gh release create "$GITHUB_REF_NAME" \
            "linnstrument-firmware-$GITHUB_REF_NAME.bin" \
            "linnstrument-firmware-$GITHUB_REF_NAME.elf" \
            "linnstrument-firmware-$GITHUB_REF_NAME.map" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
